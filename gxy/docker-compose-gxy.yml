name: gxy

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gxy-gateway
    restart: unless-stopped
    ports:
      - "8585:8585"
      - "8584:8584"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./logs:/app/logs
      - ./gateway:/app/gateway:ro
    command: ["./gateway", "-config", "/app/config.json", "-log", "/app/logs/gateway.log"]
    networks:
      - ixpay-network

networks:
  ixpay-network:
    name: server_ixpay-network
    external: true
