# ixpay-pro 配置示例

server:
  host: 127.0.0.1
  port: "8586"
  read_timeout: 10
  write_timeout: 10
  idle_timeout: 60
  node_role: "all"           # api / task / all
  node_id: ""                # 留空自动生成
  task_max_concurrent: 10

# 网关注册配置
gateway:
  enabled: false              # 是否启用网关注册
  gateway_url: "http://127.0.0.1:8385"  # 网关地址
  auth_key: "ihvke@2025"     # 网关注册认证密钥（需与网关配置一致）
  service_name: "ixpay-server"  # 服务名称
  heartbeat_interval: 10      # 心跳间隔（秒）

postgres:
  host: 127.0.0.1
  port: "5432"
  user: postgres
  password: ""
  dbname: ixpay_pro
  sslmode: disable

redis:
  address: 127.0.0.1:6379
  password: ""
  db: 0

jwt:
  secret_key: ""
  access_token_expire: 2h
  refresh_token_expire: 168h
