# ixpay-pro 配置示例
# 复制此文件为 config.yaml 并根据实际环境修改配置

server:
  host: 127.0.0.1
  port: "8081"
  read_timeout: 10
  write_timeout: 10
  idle_timeout: 60
  captcha_time_out: 300          # 验证码过期时间（秒）
  captcha_len: 4                 # 验证码长度
  open_captcha: true             # 是否开启验证码
  machine_id: "1"                # 机器ID（用于雪花ID生成）
  update_routes_on_start: true   # 启动时是否更新路由注册
  init_seed_data: true           # 启动时是否初始化种子数据
  slow_query_threshold: 200      # 慢查询阈值（毫秒）
  node_role: "all"               # 节点角色: api / task / all
  node_id: ""                    # 节点ID（留空自动生成）
  task_max_concurrent: 10        # 任务最大并发数
  environment: "development"     # 运行环境: development / staging / production

# 网关注册配置
gateway:
  enabled: false                 # 是否启用网关注册
  gateway_url: "http://127.0.0.1:8085"  # 网关地址
  auth_key: "ihvke@2025"        # 网关注册认证密钥（需与网关配置一致）
  service_name: "ixpay-server"  # 服务名称
  heartbeat_interval: 10         # 心跳间隔（秒）

# 数据库配置
postgres:
  host: 127.0.0.1
  port: "5432"
  user: postgres
  password: ""
  dbname: ixpay_pro
  sslmode: disable

# 连接池配置
db_pool:
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 60          # 分钟

# Redis 缓存配置
redis:
  address: 127.0.0.1:6379
  password: ""
  db: 0
  dial_timeout: 5                # 连接超时（秒）
  read_timeout: 3                # 读取超时（秒）
  write_timeout: 3               # 写入超时（秒）

# JWT 认证配置
jwt:
  secret_key: ""                 # JWT 签名密钥（必须修改为随机字符串）
  access_token_expire: 2h        # 访问令牌过期时间
  refresh_token_expire: 168h     # 刷新令牌过期时间（7天）

# 日志配置
logging:
  level: "info"                  # 日志级别: debug / info / warn / error
  format: "json"                 # 日志格式: json / text
  file_path: "./logs/app.log"    # 应用日志文件路径
  error_file: "./logs/error.log" # 错误日志文件路径
  task_file: "./logs/task.log"   # 任务日志文件路径
  request_file: "./logs/request.log"  # 请求日志文件路径
  audit_file: "./logs/audit.log" # 审计日志文件路径
  max_size: 100                  # 单个日志文件最大大小（MB）
  max_backups: 30                # 保留的日志文件数量
  max_age: 30                    # 日志保留天数
  separate_log: true             # 是否分离日志文件

# 微信配置说明
# 微信相关所有配置（app_id/app_secret/小程序/商户号/证书序列号/APIv3密钥/私钥/公钥/服务商/回调地址/医保）
# 全部保存在数据库 base_configs 配置表（启动时由种子初始化，可在管理端「配置管理」中修改），
# 其中敏感配置（wechat_app_secret/wechat_miniapp_app_secret/wechat_apiv3_key/wechat_private_key/wechat_med_partner_secret）
# 使用 security.config_encrypt_key 进行 AES-256-GCM 加密后存储，读取时自动解密为明文使用。
# 数据库配置键清单见 internal/domain/base/seed/config_seed.go

# 安全配置
security:
  config_encrypt_key: ""         # 数据库敏感配置加密密钥（AES-256-GCM；为空则不加密，建议设置为随机长字符串）

# Swagger 文档配置
swagger:
  enabled: true                  # 是否启用Swagger文档
  path: "/swagger"               # Swagger文档访问路径